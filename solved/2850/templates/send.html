<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <title>Relay</title>
</head>
<body>
    <div class="card">
        <a href="/" style="text-decoration:none; color:#0984e3; font-size:0.8rem;">← Back</a>
        <h2>Relay Message</h2>
        <form method="GET">
            <div class="form-group">
                <label>Sender (Your IP):</label>
                <input type="text" value="{{ ip }}" readonly>
            </div>
            <div class="form-group">
                <label>Receiver URL:</label>
                <input type="text" name="receiver_url" placeholder="http://internal-db.local" required>
            </div>
            <button type="submit" class="btn btn-primary">Send Request</button>
        </form>
        {% if res_text %}<div class="flag" style="border-color:#0984e3; color:#0984e3;">{{ res_text }}</div>{% endif %}
    </div>
</body>
</html>
