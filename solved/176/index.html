        <script>
            ws = new WebSocket(`ws:///${location.host}/ws`); // global var
            function decrypt(data){
                // TODO: make decrypt function!
                return data
            }
            ws.onmessage = function(event){
                if(event.data.toString() == "[object Blob]"){
                    event.data.text().then(function(e){alert(decrypt(e))})
                }else{
                    console.log(event)
                }
            }
            ws.onopen = function(event){
                ws.send(JSON.stringify({
                    // encrypt with information of user
                    "command": "set_info",
                    "Y": 1990,
                    "M": 7,
                    "D": 12,
                    "name": "dreamhack"
                }));
            }
            function showtext(index){
                ws.send(JSON.stringify({
                    "command": "get_text",
                    "text_index": index
                }))
            };
        </script>
